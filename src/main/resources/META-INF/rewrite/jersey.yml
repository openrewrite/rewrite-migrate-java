type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.Jersey1GrizzlyToJersey2Grizzly
displayName: Move Grizzly 2.2 code to the Grizzly that Jersey 2 uses
description: >-
  Jersey 1's `jersey-grizzly2` brings Grizzly 2.2, and Jersey 2's Grizzly container brings Grizzly 2.4, which renamed
  `NetworkListener.setMaxPostSize` to `setMaxFormPostSize`. This only changes modules that depend on `jersey-grizzly2`.
tags:
  - jersey
  - grizzly
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: com.sun.jersey
      artifactIdPattern: jersey-grizzly2
recipeList:
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.glassfish.grizzly.http.server.NetworkListener setMaxPostSize(int)
      newMethodName: setMaxFormPostSize
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.glassfish.grizzly.http.server.NetworkListener getMaxPostSize()
      newMethodName: getMaxFormPostSize

