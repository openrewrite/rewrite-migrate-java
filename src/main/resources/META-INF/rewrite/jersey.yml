type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.Jersey1DependenciesToJersey2
displayName: Use the Jersey 2 dependencies for Jersey 1 dependencies
description: >-
  Replaces each Jersey 1 dependency with its Jersey 2 counterpart, the JAX-RS 1.1 API with the JAX-RS 2.1 API, and
  `jersey-json` with Jackson 1's JAX-RS provider, which is what Jersey 1's POJO mapping used. Jersey 2.26 and later
  need an injection manager at runtime, so modules that use Jersey get `jersey-hk2`. Modules that use Jettison or the
  Jersey 1 view API get the dependency that `jersey-json` or `jersey-server` used to bring along.
recipeList:
  - org.openrewrite.java.migrate.jersey.AddJerseyHk2
  - org.openrewrite.java.migrate.jersey.AddJackson1XcForJerseyJson
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
