---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.AddJerseyHk2
displayName: Add `jersey-hk2` to modules that use Jersey 1
description: >-
  Jersey 2.26 and later find their injection manager on the runtime classpath, and fail to start without one, so
  this adds `org.glassfish.jersey.inject:jersey-hk2` at runtime to modules that declare a Jersey 1 dependency.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: com.sun.jersey*
      artifactIdPattern: "*"
      onlyDirect: true
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.glassfish.jersey.inject
      artifactId: jersey-hk2
      version: 2.x
      scope: runtime
      configuration: runtimeOnly

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.AddJackson1XcForJerseyJson
displayName: Add Jackson 1's JAXB support where `jersey-json` was used
description: >-
  Jersey 1's POJO mapping used Jackson 1's `JacksonJaxbJsonProvider`, which reads JAXB annotations through
  `jackson-xc`. `jersey-json` brought it along, so modules that declare `jersey-json` get it directly.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: com.sun.jersey
      artifactIdPattern: jersey-json
      onlyDirect: true
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.codehaus.jackson
      artifactId: jackson-xc
      version: 1.9.13
