  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.sun.jersey.multipart
      newPackageName: org.glassfish.jersey.media.multipart
      recursive: true

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.Jersey1DependenciesToJersey2
displayName: Use the Jersey 2 dependencies for Jersey 1 dependencies
description: >-
  Replaces each Jersey 1 dependency with its Jersey 2 counterpart, the JAX-RS 1.1 API with the JAX-RS 2.1 API, and
  `jersey-json` with Jackson 1's JAX-RS provider, which is what Jersey 1's POJO mapping used. Jersey 2.26 and later
  need an injection manager at runtime, so modules that use Jersey get `jersey-hk2`. Modules that use Jettison or the
  Jersey 1 view API get the dependency that `jersey-json` or `jersey-server` used to bring along.
recipeList:
  - org.openrewrite.java.migrate.jersey.AddJerseyHk2
  - org.openrewrite.java.migrate.jersey.AddJackson1XcForJerseyJson
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.codehaus.jettison
      artifactId: jettison
      version: 1.5.x
      onlyIfUsing: org.codehaus.jettison..*
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.glassfish.jersey.ext
      artifactId: jersey-mvc
      version: 2.x
      onlyIfUsing: com.sun.jersey.api.view.Viewable
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-client
      newGroupId: org.glassfish.jersey.core
      newArtifactId: jersey-client
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-core
      newGroupId: org.glassfish.jersey.core
      newArtifactId: jersey-common
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-server
      newGroupId: org.glassfish.jersey.core
      newArtifactId: jersey-server
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-servlet
      newGroupId: org.glassfish.jersey.containers
      newArtifactId: jersey-container-servlet
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-bundle
      newGroupId: org.glassfish.jersey.bundles
      newArtifactId: jaxrs-ri
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-grizzly2
      newGroupId: org.glassfish.jersey.containers
      newArtifactId: jersey-container-grizzly2-http
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-grizzly2-servlet
      newGroupId: org.glassfish.jersey.containers
      newArtifactId: jersey-container-grizzly2-servlet
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey
      oldArtifactId: jersey-json
      newGroupId: org.codehaus.jackson
      newArtifactId: jackson-jaxrs
      newVersion: 1.9.13
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey.contribs
      oldArtifactId: jersey-multipart
      newGroupId: org.glassfish.jersey.media
      newArtifactId: jersey-media-multipart
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey.jersey-test-framework
      oldArtifactId: jersey-test-framework-core
      newGroupId: org.glassfish.jersey.test-framework
      newArtifactId: jersey-test-framework-core
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey.jersey-test-framework
      oldArtifactId: jersey-test-framework-grizzly2
      newGroupId: org.glassfish.jersey.test-framework.providers
      newArtifactId: jersey-test-framework-provider-grizzly2
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey.jersey-test-framework
      oldArtifactId: jersey-test-framework-inmemory
      newGroupId: org.glassfish.jersey.test-framework.providers
      newArtifactId: jersey-test-framework-provider-inmemory
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey.jersey-test-framework
      oldArtifactId: jersey-test-framework-http
      newGroupId: org.glassfish.jersey.test-framework.providers
      newArtifactId: jersey-test-framework-provider-jdk-http
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.sun.jersey.jersey-test-framework
      oldArtifactId: jersey-test-framework-external
      newGroupId: org.glassfish.jersey.test-framework.providers
      newArtifactId: jersey-test-framework-provider-external
      newVersion: 2.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: javax.ws.rs
      oldArtifactId: jsr311-api
      newArtifactId: javax.ws.rs-api
      newVersion: 2.1.1

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.AddJerseyHk2
displayName: Add `jersey-hk2` to modules that use Jersey 1
description: >-
  Jersey 2.26 and later find their injection manager on the runtime classpath, and fail to start without one, so
  this adds `org.glassfish.jersey.inject:jersey-hk2` at runtime to modules that declare a Jersey 1 dependency.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: com.sun.jersey*
      artifactIdPattern: "*"
      onlyDirect: true
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.glassfish.jersey.inject
      artifactId: jersey-hk2
      version: 2.x
      scope: runtime
      configuration: runtimeOnly

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.AddJackson1XcForJerseyJson
displayName: Add Jackson 1's JAXB support where `jersey-json` was used
description: >-
  Jersey 1's POJO mapping used Jackson 1's `JacksonJaxbJsonProvider`, which reads JAXB annotations through
  `jackson-xc`. `jersey-json` brought it along, so modules that declare `jersey-json` get it directly.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: com.sun.jersey
      artifactIdPattern: jersey-json
      onlyDirect: true
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.codehaus.jackson
      artifactId: jackson-xc
      version: 1.9.13
