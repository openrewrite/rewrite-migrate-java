type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.Jersey1ClientMethodsToJaxRs
displayName: Rename Jersey 1 client methods to their JAX-RS 2 names
description: >-
  Renames the methods of the Jersey 1 `Client`, `WebResource` and `ClientResponse` whose JAX-RS 2 counterparts on
  `Client`, `WebTarget` and `Response` take the same arguments: `resource` is `target`, `destroy` is `close`,
  `getEntity` is `readEntity`, and the headers of a response, which Jersey 1 gave as strings, are
  `getStringHeaders()`.
recipeList:
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.Client resource(..)
      newMethodName: target
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.Client destroy()
      newMethodName: close
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.WebResource getRequestBuilder()
      newMethodName: request
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.WebResource getURI()
      newMethodName: getUri
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.WebResource getBuilder()
      newMethodName: getUriBuilder
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getEntity(..)
      newMethodName: readEntity
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getHeaders()
      newMethodName: getStringHeaders
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getMetadata()
      newMethodName: getStringHeaders
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getType()
      newMethodName: getMediaType
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getResponseDate()
      newMethodName: getDate
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getAllow()
      newMethodName: getAllowedMethods

