type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.Jersey1ServerToJersey2
displayName: Migrate the Jersey 1 server configuration to Jersey 2
description: >-
  Moves what configures a Jersey 1 application to Jersey 2: features, properties, classes and singletons added to a
  `ResourceConfig`, `ClientConfig` or `Client` are registered through the JAX-RS 2 `Configurable` methods, a
  `PackagesResourceConfig` becomes a `ResourceConfig` scanning the same packages, the Jersey 1 HTTP server factories
  become their Jersey 2 counterparts, the Jersey 1 servlets and filters in `web.xml` become Jersey 2's, and container
  request and response filters become JAX-RS 2 `ContainerRequestFilter`s and `ContainerResponseFilter`s, registered
  where Jersey 1 listed them.
tags:
  - jersey
recipeList:
  - org.openrewrite.java.migrate.jersey.FeaturesAndPropertiesToConfigurable
  - org.openrewrite.java.migrate.jersey.PackagesResourceConfigToResourceConfig
  - org.openrewrite.java.migrate.jersey.Jersey1ServerFactoriesToJersey2
  - org.openrewrite.java.migrate.jersey.MigrateJersey1WebXml
  - org.openrewrite.java.migrate.jersey.MigrateJersey1ContainerFiltersInWebXml
  - org.openrewrite.java.migrate.jersey.Jersey1ContainerFilterToJaxRsFilter
  - org.openrewrite.java.migrate.jersey.Jersey1GrizzlyToJersey2Grizzly

