---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.MigrateToJersey2
displayName: Migrate from Jersey 1 to Jersey 2
description: >-
  Migrate applications from Jersey 1 (`com.sun.jersey`, JAX-RS 1.1) to Jersey 2 (`org.glassfish.jersey`, JAX-RS 2.1),
  which keeps the `javax.ws.rs` packages and needs Java 8 or later. This changes the Jersey dependencies, moves the
  client code to the JAX-RS 2 client API (`ClientBuilder`, `WebTarget`, `Invocation.Builder`, `Entity`, `Response`),
  and moves the server configuration, `web.xml` included, multipart and the other APIs that have a Jersey 2
  counterpart. Jersey 1's POJO mapping used Jackson 1, so Jersey 2 gets Jackson 1's JAX-RS provider, registered where
  POJO mapping was switched on, which keeps the JSON the same. A repository is left alone when a library that is not
  Jersey brings Jersey 1 along, such as Dropwizard before 0.8, Eureka 1 or Hadoop, because that library would still
  need Jersey 1, or when Jersey 1 is `provided` or `compileOnly`, or when it uses the Jersey 1 Guice integration. Left
  for the compiler to point out are the Jersey 1 SPIs without a mechanical replacement: container request and
  response filters, `InjectableProvider`, client filters that read the response, `HTTPSProperties`, the Apache HTTP
  client connectors and `JSONConfiguration`.
tags:
  - jersey
  - jaxrs
preconditions:
  - org.openrewrite.java.migrate.jersey.Jersey1RepositoryCanMigrate
recipeList:
  - org.openrewrite.java.migrate.jersey.WebResourceRequestToInvocation
  - org.openrewrite.java.migrate.jersey.Jersey1ClientMethodsToJaxRs
  - org.openrewrite.java.migrate.jersey.Jersey1TypesToJersey2
  - org.openrewrite.java.migrate.jersey.Jersey1DependenciesToJersey2

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.Jersey1ClientMethodsToJaxRs
displayName: Rename Jersey 1 client methods to their JAX-RS 2 names
description: >-
  Renames the methods of the Jersey 1 `Client`, `WebResource` and `ClientResponse` whose JAX-RS 2 counterparts on
  `Client`, `WebTarget` and `Response` take the same arguments: `resource` is `target`, `destroy` is `close`,
  `getEntity` is `readEntity`, and the headers of a response, which Jersey 1 gave as strings, are
  `getStringHeaders()`.
recipeList:
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.Client resource(..)
      newMethodName: target
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.Client destroy()
      newMethodName: close
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.WebResource getRequestBuilder()
      newMethodName: request
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.WebResource getURI()
      newMethodName: getUri
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.WebResource getBuilder()
      newMethodName: getUriBuilder
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getEntity(..)
      newMethodName: readEntity
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getHeaders()
      newMethodName: getStringHeaders
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getMetadata()
      newMethodName: getStringHeaders
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getType()
      newMethodName: getMediaType
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getResponseDate()
      newMethodName: getDate
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.sun.jersey.api.client.ClientResponse getAllow()
      newMethodName: getAllowedMethods

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.jersey.Jersey1TypesToJersey2
displayName: Use the JAX-RS 2 and Jersey 2 types for Jersey 1 types
description: >-
  Replaces the Jersey 1 types that have a counterpart with the same methods in JAX-RS 2 or Jersey 2, such as the
  client's `Client`, `WebResource` and `ClientResponse`, the exceptions, `ResourceConfig`, `ServletContainer` and the
  multipart API.
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.Client
      newFullyQualifiedTypeName: javax.ws.rs.client.Client
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.WebResource$Builder
      newFullyQualifiedTypeName: javax.ws.rs.client.Invocation$Builder
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.WebResource
      newFullyQualifiedTypeName: javax.ws.rs.client.WebTarget
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.ClientResponse$Status
      newFullyQualifiedTypeName: javax.ws.rs.core.Response$Status
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.ClientResponse
      newFullyQualifiedTypeName: javax.ws.rs.core.Response
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.GenericType
      newFullyQualifiedTypeName: javax.ws.rs.core.GenericType
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.UniformInterfaceException
      newFullyQualifiedTypeName: javax.ws.rs.WebApplicationException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.ClientHandlerException
      newFullyQualifiedTypeName: javax.ws.rs.ProcessingException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.config.DefaultClientConfig
      newFullyQualifiedTypeName: org.glassfish.jersey.client.ClientConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.client.config.ClientConfig
      newFullyQualifiedTypeName: org.glassfish.jersey.client.ClientConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.NotFoundException
      newFullyQualifiedTypeName: javax.ws.rs.NotFoundException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.ParamException$URIParamException
      newFullyQualifiedTypeName: org.glassfish.jersey.server.ParamException$UriParamException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.ParamException
      newFullyQualifiedTypeName: org.glassfish.jersey.server.ParamException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.container.ContainerException
      newFullyQualifiedTypeName: org.glassfish.jersey.server.ContainerException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.spi.resource.Singleton
      newFullyQualifiedTypeName: javax.inject.Singleton
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.spi.container.servlet.ServletContainer
      newFullyQualifiedTypeName: org.glassfish.jersey.servlet.ServletContainer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.core.PackagesResourceConfig
      newFullyQualifiedTypeName: org.glassfish.jersey.server.ResourceConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.core.ClassNamesResourceConfig
      newFullyQualifiedTypeName: org.glassfish.jersey.server.ResourceConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.core.DefaultResourceConfig
      newFullyQualifiedTypeName: org.glassfish.jersey.server.ResourceConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.core.ResourceConfig
      newFullyQualifiedTypeName: org.glassfish.jersey.server.ResourceConfig
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.view.Viewable
      newFullyQualifiedTypeName: org.glassfish.jersey.server.mvc.Viewable
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.uri.UriComponent
      newFullyQualifiedTypeName: org.glassfish.jersey.uri.UriComponent
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.api.uri.UriTemplate
      newFullyQualifiedTypeName: org.glassfish.jersey.uri.UriTemplate
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.core.util.MultivaluedMapImpl
      newFullyQualifiedTypeName: javax.ws.rs.core.MultivaluedHashMap
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.sun.jersey.core.header.FormDataContentDisposition
      newFullyQualifiedTypeName: org.glassfish.jersey.media.multipart.FormDataContentDisposition
