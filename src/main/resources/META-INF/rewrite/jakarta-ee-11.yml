  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.eclipse.jetty.ee10.websocket
      oldArtifactId: jetty-ee10-websocket-jakarta-client
      newGroupId: org.eclipse.jetty.ee11.websocket
      newArtifactId: jetty-ee11-websocket-jakarta-client
      newVersion: 12.1.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.eclipse.jetty.ee10.websocket
      oldArtifactId: jetty-ee10-websocket-jakarta-client-webapp
      newGroupId: org.eclipse.jetty.ee11.websocket
      newArtifactId: jetty-ee11-websocket-jakarta-client-webapp
      newVersion: 12.1.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.eclipse.jetty.ee10.websocket
      oldArtifactId: jetty-ee10-websocket-jakarta-common
