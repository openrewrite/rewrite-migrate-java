---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.BouncyCastleFromJdk15OnToJdk15to18
displayName: Migrate Bouncy Castle to `jdk15to18` for Java < 8
description: >-
  This recipe replaces the Bouncy Castle artifacts from any of the legacy artifact suffixes
  `-jdk12`, `-jdk14`, `-jdk15`, `-jdk15+`, `-jdk16` or `-jdk15on` to `-jdk15to18`.
  Those artifacts aren't maintained anymore and `jdk18on` is only for Java 8 and above.
  The `jdk15to18` artifact is the up-to-date replacement for Java < 8.
  The `bctsp` artifacts map onto `bcpkix`, which absorbed the time stamp protocol support in 1.47.
tags:
  - bouncycastle
preconditions:
  - org.openrewrite.Singleton
recipeList:
  # -jdk15on migration
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bcprov-jdk15on
      newArtifactId: bcprov-jdk15to18
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bcprov-ext-jdk15on
      newArtifactId: bcprov-ext-jdk15to18
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bcutil-jdk15on
      newArtifactId: bcutil-jdk15to18
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bcpkix-jdk15on
      newArtifactId: bcpkix-jdk15to18
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bcmail-jdk15on
      newArtifactId: bcmail-jdk15to18
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bcjmail-jdk15on
      newArtifactId: bcjmail-jdk15to18
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bcpg-jdk15on
      newArtifactId: bcpg-jdk15to18
      newVersion: latest.release
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.bouncycastle
      oldArtifactId: bctls-jdk15on
      newArtifactId: bctls-jdk15to18
      newVersion: latest.release

  # -jdk16 migration
