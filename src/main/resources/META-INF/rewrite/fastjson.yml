      newFullyQualifiedTypeName: com.alibaba.fastjson2.support.spring6.data.redis.GenericFastJsonRedisSerializer
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.alibaba.fastjson.support.spring.messaging.MappingFastJsonMessageConverter
      newFullyQualifiedTypeName: com.alibaba.fastjson2.support.spring6.messaging.converter.MappingFastJsonMessageConverter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.alibaba.fastjson.support.spring.FastjsonSockJsMessageCodec
      newFullyQualifiedTypeName: com.alibaba.fastjson2.support.spring6.websocket.sockjs.FastjsonSockJsMessageCodec
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.alibaba.fastjson2
      artifactId: fastjson2-extension-spring6
