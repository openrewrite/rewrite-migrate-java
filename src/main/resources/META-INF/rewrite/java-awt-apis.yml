---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.migrate.awt.JavaAwtAPIs
displayName: Use modernized `java.awt` APIs
description: >-
  Replace calls to AWT and Swing methods deprecated since JDK 1.1 with calls to the methods that replaced them, such as
  `Component#show()` with `Component#setVisible(true)`.
tags:
  - deprecated
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.migrate.awt.ReplaceDeprecatedAwtMethod:
      methodPattern: java.awt.Component show()
      newMethodName: setVisible
      booleanArgument: true
  - org.openrewrite.java.migrate.awt.ReplaceDeprecatedAwtMethod:
      methodPattern: java.awt.Component show(boolean)
      newMethodName: setVisible
  - org.openrewrite.java.migrate.awt.ReplaceDeprecatedAwtMethod:
      methodPattern: java.awt.Component hide()
      newMethodName: setVisible
      booleanArgument: false
